occ:
  selectors:
    offers_grid-detail:
      - "div[data-offers-grid-detail-popup-scroll]"
      - "div[data-offers-grid-detail-container]"
    title:
     - "p[data-offers-grid-detail-title]"
     - "p.font-h4-m"
    company:
     - "span.line-clamp-2"
    description:
      - "div.break-words"
    description:
      - "div > div.mt-6"
      - "div > div.fs16"
    salary:
      - "p.font-small-strong"
      - "p.font-small-strong span.icon.i_money"
    contract_type:
      - ""

linkedin:
  selectors:
    modal_overlay:
     - ".modal__overlay[aria-hidden='false']"
    modal_content:
      - "section[aria-labelledby='base-contextual-sign-in-modal-modal-header']"
      - "section[aria-modal]"
    modal_dismiss_btn:
      - ".modal__dismiss"
      - "button[aria-label='Dismiss']"
      - "button[data-tracking-control-name='public_jobs_contextual-sign-in-modal_modal_dismiss']"
    main_content:
      - "#main-content"
    title:
      - ".top-card-layout__title"
    company:
      - "a[data-tracking-control-name='public_jobs_topcard-org-name']"